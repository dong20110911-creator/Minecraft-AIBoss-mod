plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.aiencounters'
version = '0.0.1-m0'

base {
    archivesName = 'ai_encounters'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // VERSION_LOCK.md: official mappings for 1.20.1 (UNVERIFIED until first successful build)
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Curios ships mixins referencing SRG names; remap them in the dev environment
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            mods {
                ai_encounters {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', 'ai_encounters'
            // ./gradlew runClient -Pquickplay=<save folder name> joins that singleplayer world directly
            if (project.hasProperty('quickplay')) {
                args '--quickPlaySingleplayer', project.property('quickplay'), '--width', '854', '--height', '480'
            }
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'ai_encounters'
        }
        server {
            property 'forge.enabledGameTestNamespaces', 'ai_encounters'
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Core required dependencies (see VERSION_LOCK.md)
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_version: version,
        geckolib_version_range: geckolib_version_range,
        curios_version_range: curios_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
        'Specification-Title'   : 'ai_encounters',
        'Specification-Version' : '1',
        'Implementation-Title'  : project.name,
        'Implementation-Version': project.jar.archiveVersion
    ])
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Forward stdin so scripts can send "stop" to the dev dedicated server
tasks.withType(JavaExec).configureEach {
    standardInput = System.in
}
